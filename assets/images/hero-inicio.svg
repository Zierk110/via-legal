  <circle cx="240" cy="62" r="9" fill="#C9982F"/>
  <path d="M115 165 A35 22 0 0 0 185 165 Z" fill="#C9982F" opacity="0.9"/>
  <path d="M295 165 A35 22 0 0 0 365 165 Z" fill="#C9982F" opacity="0.9"/>
  <rect x="228" y="150" width="24" height="14" rx="3" fill="#C9982F"/>
  <rect x="200" y="180" width="80" height="16" rx="4" fill="#C9982F"/>

  <!-- pedestal -->
