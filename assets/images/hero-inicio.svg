  <rect x="196" y="262" width="88" height="16" rx="4" fill="#C9982F"/>

  <!-- libro abierto -->
  <g>
    <path d="M90 330 C140 312 190 312 240 328 L240 388 C190 372 140 372 90 390 Z" fill="#FAF9F6"/>
    <path d="M390 330 C340 312 290 312 240 328 L240 388 C290 372 340 372 390 390 Z" fill="#FAF9F6"/>
    <path d="M90 330 C140 312 190 312 240 328 L240 388 C190 372 140 372 90 390 Z" fill="none" stroke="#C9982F" stroke-width="3"/>
    <path d="M390 330 C340 312 290 312 240 328 L240 388 C290 372 340 372 390 390 Z" fill="none" stroke="#C9982F" stroke-width="3"/>
