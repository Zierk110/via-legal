    <line x1="110" y1="352" x2="222" y2="344" stroke="#B9C4DA" stroke-width="3" opacity="0.6"/>
    <line x1="110" y1="368" x2="222" y2="362" stroke="#B9C4DA" stroke-width="3" opacity="0.6"/>
    <line x1="370" y1="336" x2="258" y2="326" stroke="#B9C4DA" stroke-width="3" opacity="0.6"/>
    <line x1="370" y1="352" x2="258" y2="344" stroke="#B9C4DA" stroke-width="3" opacity="0.6"/>
    <line x1="370" y1="368" x2="258" y2="362" stroke="#B9C4DA" stroke-width="3" opacity="0.6"/>
