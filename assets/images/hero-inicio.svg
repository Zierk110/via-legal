  </defs>

  <!-- fondo redondeado -->
  <rect x="10" y="10" width="460" height="420" rx="36" fill="url(#bgGrad)"/>

  <!-- acentos circulares -->
  <circle cx="90" cy="90" r="5" fill="#C9982F" opacity="0.85"/>
  <circle cx="400" cy="70" r="4" fill="#C9982F" opacity="0.6"/>
  <circle cx="420" cy="330" r="6" fill="#C9982F" opacity="0.5"/>
  <circle cx="70" cy="340" r="4" fill="#C9982F" opacity="0.55"/>

  <!-- balanza -->
  <g stroke="#C9982F" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="240" y1="70" x2="240" y2="150"/>
    <line x1="150" y1="108" x2="330" y2="108"/>
    <line x1="150" y1="108" x2="120" y2="165"/>
